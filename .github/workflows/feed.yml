name: עדכון רשימת הפרקים

# Every 30 minutes: list the lessons whose release time has arrived (build/feed.py).
# The feed is never changed during Shabbat / chag (Friday or erev-chag 16:00 -> Saturday or chag 21:00).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            build/
            */series.json
            */schedule.json
            */feed.xml
          sparse-checkout-cone-mode: false
      - name: Build feed
        run: python3 build/feed.py
      - name: Commit and refresh the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "עדכון רשימת הפרקים"
            # Someone else may have pushed to main while we were building: sync first, retry a few times.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push failed (attempt $attempt), retrying..."
              sleep 5
            done
            git diff --quiet origin/main HEAD || { echo "push did not succeed"; exit 1; }
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
